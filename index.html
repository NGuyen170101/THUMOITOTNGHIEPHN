<!DOCTYPE html>
<!--
  ╔══════════════════════════════════════════════════════════╗
  ║  HƯỚNG DẪN CHỈNH SỬA THIỆP — đọc trước khi sửa           ║
  ╚══════════════════════════════════════════════════════════╝
  1) Thông tin, câu chữ, ảnh, nhạc ........ khối "CẤU HÌNH" ở đầu phần <script> (cuối file).
  2) Mỗi thiệp mới: chép thư mục → sửa CONFIG → thay ảnh → đổi <title> và og:... bên dưới.
  3) Ảnh cần có cạnh file này:
       logo.png      logo ở bìa              bg.jpg        ảnh nền thiệp
       portrait.png  chân dung TÁCH NỀN      portrait.jpg  ảnh thường cho xấp polaroid
       og.jpg        ảnh xem trước link (1200×630)
  4) Link mời riêng:  .../index.html?khach=Chị Lan   (tên ghi sao hiện vậy, tự thêm danh xưng)
     Mở bảng tạo link:  .../index.html?admin=1
  5) Đổi màu: CSS biến ở đầu phần <style> (:root). Đổi chữ cố định ("Tân Cử Nhân", "Khoảnh khắc thanh xuân"...): tìm trực tiếp trong phần HTML.
  6) Muốn nhận lời chúc/tim: làm theo hướng dẫn Code.gs rồi điền wishEndpoint + token trong CONFIG.
  7) Bật/tắt từng hiệu ứng (nhòe dần, kính mờ, zoom nền, pháo giấy, sao, rung...): khối EFFECTS ngay dưới CONFIG (true = bật, false = tắt).
  8) Ảnh chân dung tách nền: thiệp TỰ cắt phần trong suốt thừa quanh người rồi phóng vừa khung. Chỉnh cao/thấp, lệch trái-phải, độ mờ viền phải: CONFIG.portraitHeight / portraitX / portraitFade.
-->
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thư Mời Lễ Tốt Nghiệp</title>
<meta name="description" content="Trân trọng kính mời bạn đến chung vui trong Lễ Tốt Nghiệp 2027.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#cbd5e1">
<!-- Xem trước link khi gửi Zalo/Facebook: đổi og:image thành URL tuyệt đối (https://...) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Thư Mời Lễ Tốt Nghiệp 2027">
<meta property="og:description" content="Chạm để mở thiệp và xem thông tin buổi lễ.">
<meta property="og:image" content="og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script>
<style>
:root{
  /* 👉 Đổi màu chủ đạo: --accent (xanh nhấn: chữ năm, đường kẻ), --ink (chữ đậm, nút). Dùng mã màu #rrggbb */
  --ink:#0f172a; --text:#1e293b; --muted:#475569; --soft:#64748b;
  --accent:#0369a1; --line:#cbd5e1;
  --ease:cubic-bezier(.22,1,.36,1);
  --flip:cubic-bezier(.3,.55,.2,1);   /* nhịp chung: lật bìa + giãn thiệp + scale (1 chỗ đổi cả 3) */
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Montserrat',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(circle at top,#cbd5e1 0%,#94a3b8 100%) fixed;
  min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;
  padding:12px;overflow-x:hidden;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button,a{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== SCALE THEO CHIỀU NGANG =====
   Thiệp thiết kế cố định 420px rồi co/giãn theo bề ngang màn hình (JS đặt --s).
   Chiều dọc để tự cuộn. */
.stage{width:420px;max-width:100%;position:relative}
.card{width:420px;position:absolute;top:0;left:0;transform:scale(var(--s,1));transform-origin:top left;perspective:1600px}

/* Chỉ bật chuyển động scale sau lần chạm đầu tiên (tránh thiệp bị 'nhảy' khi vừa tải trang) */
.anim .card{transition:transform .9s var(--flip)}
.anim .stage{transition:width .9s var(--flip),height var(--expand,0s) var(--flip)}
.inside{
  position:relative;overflow:hidden;border-radius:24px;background:#f8fafc;
  box-shadow:0 25px 50px rgba(15,23,42,.18);padding:22px 18px 18px;text-align:center;
  display:flex;flex-direction:column;gap:10px;height:var(--cover-h,740px);contain:paint;
  transition:height var(--expand,0s) var(--flip);   /* mặc định bung tức thì (0s) — xem EXPAND_MS */
}
/* Blur nền áp thẳng lên ảnh (rẻ hơn backdrop-filter phủ cả thiệp khi ảnh đang zoom) */
.bg{position:absolute;top:-6px;left:-6px;right:-6px;height:calc(var(--full-h,1100px) + 12px);background:url('bg.jpg') center bottom/cover;filter:blur(2.5px);
  transform:scale(1.08);transition:transform .9s ease-out;will-change:transform}   /* zoom nền xong trong lúc bìa lật, trước khi kính hiện */
.card.open .bg{transform:scale(1)}
.card.settled .bg{will-change:auto}
.bg-overlay{position:absolute;top:0;left:0;right:0;height:var(--full-h,1100px);
  background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(255,255,255,.64) 45%,rgba(255,255,255,.88))}
.layer{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px;flex:none}   /* cao tự nhiên; .inside cắt bớt khi đang đóng */

.music{position:absolute;top:-6px;right:0;width:26px;height:26px;border-radius:50%;
  background:rgba(15,23,42,.85);color:#fff;font-size:12px;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.music.playing{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Hiệu ứng xuất hiện (độ trễ theo biến --d) */
.rv{opacity:.01;transform:translateY(14px);will-change:opacity,transform;
  transition:opacity .3s ease,transform .3s ease}                 /* đóng: mờ nhanh */
.card.open .rv:not(.low),
.card.expanded .rv.low{opacity:1;transform:none;
  transition:opacity .7s ease,transform .7s var(--ease);
  transition-delay:calc(var(--d,0)*.09s + .08s)}                                   /* mở: hiện dần, lệch nhau 0,09s */
.card.expanded .rv.low{transition-delay:calc((var(--d,0) - 3)*.09s + .05s)}
.card.closing .rv.low{opacity:.01;transition:opacity .2s ease,transform .2s ease;transition-delay:0s}   /* đóng: chỉ các khối phía dưới mờ nhanh (phần trên vẫn thấy cho tới khi bìa phủ lên) */
.card.settled .rv{will-change:auto}
/* ===== Công tắc hiệu ứng (bật/tắt trong khối EFFECTS ở script) ===== */
.fx-blur-in .rv,.fx-blur-in .photo{filter:blur(4px);transition-property:opacity,transform,filter}
.fx-blur-in .card.open .rv:not(.low),.fx-blur-in .card.expanded .rv.low{filter:none;transition-property:opacity,transform,filter}
.fx-blur-in .card.open .photo{filter:none;transition-property:opacity,transform,filter}
.no-slide-up .rv{transform:none}
.no-bg-zoom .bg{transform:none;transition:none}
.no-glass-blur .card.settled .glass{-webkit-backdrop-filter:none;backdrop-filter:none}
.no-cover-shine .cover::before{display:none}
.no-cover-flip .card.open .cover{transform:none}
.no-pulse-button .open-btn,.no-music-spin .music.playing{animation:none}
.no-portrait-shadow .photo-sh{filter:none}

.kicker{font-size:11px;font-weight:700;letter-spacing:1.8px;text-indent:1.8px;text-transform:uppercase;color:var(--muted)}
.title{font-size:20px;font-weight:800;letter-spacing:.8px;text-indent:.8px;text-transform:uppercase;line-height:1.35;margin:1px 0 0}
/* Đường kẻ ✦ chia tiêu đề / khối "ai mời ai" */
.orn{display:flex;align-items:center;justify-content:center;gap:8px;width:60%;margin:9px auto 11px}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(15,23,42,.35))}
.orn i:last-child{background:linear-gradient(270deg,transparent,rgba(15,23,42,.35))}
.orn span{font-size:10px;line-height:1;color:var(--accent)}
.guest-label{font-size:10px;font-weight:600;letter-spacing:1.2px;text-indent:1.2px;text-transform:uppercase;color:var(--soft)}
.guest{display:block;width:88%;margin:1px auto 0;padding:1px 6px 6px;text-align:center;font-size:20px;font-weight:800;color:var(--ink);
  background:linear-gradient(90deg,transparent,rgba(3,105,161,.55) 18%,rgba(3,105,161,.55) 82%,transparent) bottom/100% 1.5px no-repeat;
  border:0;border-radius:0;outline:0;cursor:default}

/* ===== KÍNH LỎNG (LIQUID GLASS) cho các hộp văn bản ===== */
.glass{
  position:relative;isolation:isolate;border-radius:14px;
  background:linear-gradient(135deg,rgba(255,255,255,.52),rgba(255,255,255,.16) 48%,rgba(255,255,255,.34));
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 8px 24px rgba(15,23,42,.12),inset 0 1px 0 rgba(255,255,255,.95),inset 1px 0 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.3);
}
/* Blur thật của kính chỉ bật sau khi hiệu ứng mở xong (tránh tính blur mỗi khung hình lúc đang chuyển động) */
.card.settled .glass{-webkit-backdrop-filter:blur(10px) saturate(1.6);backdrop-filter:blur(10px) saturate(1.6)}
.glass::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 90% at 10% -15%,rgba(255,255,255,.6),transparent 55%)}

/* ===== TÂN CỬ NHÂN (ảnh nép trái) ===== */
.hero{position:relative;display:flex;align-items:center;min-height:var(--ph,290px);margin:2px -18px calc(-10px - var(--sink,6px));padding-right:18px}
/* margin-bottom âm = triệt khoảng cách 10px tới khung bên dưới + chui --sink (px) dưới mép kính → đáy ảnh luôn sát/khít khung. Chỉnh CONFIG.portraitSink */
/* ẢNH CHÂN DUNG TÁCH NỀN. 3 lớp: .photo (animation hiện) > .photo-sh (bóng đổ) > .photo-in (cắt + mờ viền phải) > img.
   JS tự đo phần người trong PNG rồi đặt --iw/--ih/--il/--ib cho ảnh vừa khung; nếu không đo được (mở file trực tiếp...) dùng cỡ mặc định bên dưới. */
.photo{
  position:absolute;left:var(--px,16px);bottom:0;width:var(--fw,235px);height:var(--ph,290px);z-index:1;pointer-events:none;
  opacity:.01;transform:translateX(-30px) scale(1.04);will-change:opacity,transform;
  transition:opacity .3s ease,transform .3s ease;
}
.card.open .photo{opacity:1;transform:none;
  transition:opacity 1s var(--ease) .2s,transform 1s var(--ease) .2s}
.card.settled .photo{will-change:auto}
.photo-sh{width:100%;height:100%;filter:drop-shadow(2px 4px 9px rgba(15,23,42,.24))}   /* bóng nhẹ — chỉnh độ đậm ở số .24 */
.photo-in{position:relative;width:100%;height:100%;overflow:hidden;
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - var(--fade,40px)),transparent);   /* mờ dần viền phải cho mềm, không bị cắt cứng */
  mask-image:linear-gradient(to right,#000 calc(100% - var(--fade,40px)),transparent)}
.photo-in img{position:absolute;left:var(--il,0);bottom:var(--ib,0);width:var(--iw,auto);height:var(--ih,100%);max-width:none;display:block}
.info{position:relative;z-index:3;margin-left:auto;width:54%;min-width:0;padding-left:4px;text-align:right}
.badge{display:inline-block;margin-bottom:6px;padding:3px 10px;border-radius:20px;background:rgba(15,23,42,.88);
  color:#fff;font-size:9.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase}
/* Tên luôn 1 dòng: nowrap + JS tự thu nhỏ chữ nếu tên quá dài */
.name{font-size:22px;font-weight:800;line-height:1.2;margin-bottom:3px;white-space:nowrap}
.major{font-size:11.5px;font-weight:600;color:#334155;line-height:1.35}

.lead{margin-top:5px;font-size:11.5px;font-style:italic;font-weight:500;color:var(--muted)}
/* Chữ đổi màu bằng MỘT dải gradient liên tục chạy dọc theo cả dòng (không đổi theo từng ký tự → không bị "nấc").
   Dải màu --g do JS đo từ ảnh phía sau chữ: tối → sáng nhẹ, chuyển rất từ từ. */
.name.gtext,.major.gtext{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
/* Phần chữ chuyển sang sáng có viền bóng rất mỏng để không bị chìm vào vùng nền trung tính */
.name.shd,.major.shd{filter:drop-shadow(0 1px 2px rgba(15,23,42,.3));-webkit-text-stroke:.3px rgba(15,23,42,.25)}
.badge.inv{background:rgba(255,255,255,.92);color:var(--ink);box-shadow:0 1px 4px rgba(15,23,42,.25)}   /* huy hiệu bị áo tối che → đảo màu */
.thanks{z-index:3;padding:10px 14px;font-size:12px;line-height:1.5;font-style:italic;font-weight:500;color:#334155}

/* ===== POLAROID ===== */
.deck-title{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.stack{position:relative;width:150px;height:178px;margin:0 auto}
.pol{position:absolute;inset:0;padding:8px 8px 26px;background:#fff;border:1px solid #e2e8f0;border-radius:6px;
  box-shadow:0 8px 20px rgba(15,23,42,.18);transform:rotate(var(--r,0deg));user-select:none;
  transition:transform .6s cubic-bezier(.34,1.56,.64,1),opacity .5s}
.pol img{width:100%;height:128px;object-fit:cover;border-radius:3px;display:block;background:#e2e8f0}
.pol span{display:block;margin-top:5px;font-size:11px;font-weight:600;font-style:italic;color:var(--muted)}
.pol.fly{transform:translate(150px,-50px) rotate(35deg) scale(.9);opacity:0;pointer-events:none}
.hint{font-size:10px;font-style:italic;color:var(--soft);margin-top:4px}

/* ===== ĐẾM NGƯỢC (1 hộp kính, 4 ô bên trong) ===== */
.cd-cap{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.cd{display:flex;justify-content:center;gap:6px;padding:6px 8px}
.cd div{flex:1;max-width:66px;padding:4px 6px;border-radius:9px;text-align:center;background:rgba(255,255,255,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.cd b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.cd small{font-size:8.5px;font-weight:600;text-transform:uppercase;color:var(--muted)}
.cd .cd-done{flex:none;max-width:none;background:none;box-shadow:none;font-size:12px;font-weight:700;color:var(--accent)}

/* ===== THÔNG TIN ===== */
.details{padding:10px 13px;text-align:left;font-size:12px;line-height:1.4;color:var(--text);display:grid;gap:7px}
.details .row{display:flex;gap:8px}
.details .ico{font-size:14px;line-height:1.2}
.details em{display:block;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink)}

/* ===== LƯU BÚT ===== */
.wish{padding:9px 11px;text-align:left}
.wish-head{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px}
.wish-head strong{font-size:11px}
.react{display:inline-flex;gap:4px}
.react button{padding:2px 8px;border:1px solid rgba(226,232,240,.9);border-radius:12px;background:rgba(255,255,255,.75);font-size:11px;font-weight:600;color:#334155}
.wish-form{display:flex;gap:6px}
/* 16px để iOS không tự phóng to khi bấm vào ô nhập (thiệp đã được scale nên nhìn vẫn nhỏ gọn) */
.wish-form input{flex:1;min-width:0;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.8);font-size:16px;outline:0}
.wish-form button{padding:5px 14px;border-radius:8px;background:var(--ink);color:#fff;font-size:12px;font-weight:600}
.feed{max-height:56px;overflow-y:auto;margin-top:6px;display:grid;gap:3px}
.feed div{padding:3px 7px;border-radius:6px;background:rgba(241,245,249,.75);font-size:11px;color:var(--text)}

/* ===== NÚT HÀNH ĐỘNG ===== */
.actions{display:grid;grid-template-columns:2fr 1fr;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:10px 6px;border-radius:18px;
  font-size:11.5px;font-weight:600;text-decoration:none;text-align:center;line-height:1.2;
  background:var(--ink);color:#fff;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.alt{background:rgba(255,255,255,.9);color:#334155;border:1px solid var(--line)}
.contact{font-size:11px;font-style:italic;font-weight:500;color:var(--soft);text-align:right;padding-right:4px;margin-top:6px}
.contact a{color:inherit}

/* ===== BÌA THIỆP ===== */
.cover{
  position:absolute;inset:0;z-index:10;border-radius:24px;overflow:hidden;border:1px solid rgba(255,255,255,.8);text-align:center;
  background:
    radial-gradient(circle at 18% 16%,rgba(56,189,248,.24),transparent 45%),
    radial-gradient(circle at 86% 24%,rgba(129,140,248,.18),transparent 48%),
    radial-gradient(circle at 75% 84%,rgba(14,165,233,.2),transparent 50%),
    linear-gradient(155deg,#eef2f6,#e2e8f0 52%,#dbeafe);
  box-shadow:0 25px 50px rgba(15,23,42,.24);transform-origin:left center;will-change:transform,opacity;backface-visibility:hidden;
  transition:transform .9s var(--flip),opacity .3s ease,visibility 0s;          /* đóng: hiện ngay, lật về */
}
.card.open .cover{transform:rotateY(-145deg);opacity:0;pointer-events:none;visibility:hidden;
  transition:transform .9s var(--flip),opacity .5s ease .25s,visibility 0s .9s}   /* mở: lật rồi mờ dần */
/* Vệt sáng tráng gương: chỉ animate transform (GPU), không animate left như trước */
.cover::before{content:"";position:absolute;top:-20%;left:0;width:75%;height:140%;pointer-events:none;will-change:transform;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.15) 35%,rgba(255,255,255,.68) 50%,rgba(255,255,255,.15) 65%,transparent);
  transform:translateX(-180%) skewX(-18deg);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-180%) skewX(-18deg)}55%,100%{transform:translateX(220%) skewX(-18deg)}}
.cover::after{content:"";position:absolute;width:250px;height:250px;border-radius:50%;top:calc(var(--cover-h,740px) / 2);left:50%;
  transform:translate(-50%,-46%);border:1px dashed rgba(3,105,161,.22);pointer-events:none}
.cover-inner{position:absolute;top:0;left:0;right:0;height:var(--cover-h,740px);z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px 20px}
.cover .invite{font-size:12.5px;font-weight:600;letter-spacing:2.5px;text-indent:2.5px;text-transform:uppercase;color:var(--muted)}
.cover h1{text-indent:1px;margin:6px 0 2px;padding-top:4px;font-size:32px;font-weight:800;letter-spacing:1px;line-height:1.35;text-transform:uppercase;
  background:linear-gradient(135deg,#0f172a,#334155);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.cover .year{font-size:15px;font-weight:700;letter-spacing:6px;text-indent:6px;color:var(--accent)}
.logo{width:104px;height:104px;border-radius:50%;overflow:hidden;box-shadow:0 12px 28px rgba(15,23,42,.16);background:#fff}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
/* Nhấp nhô: chỉ animate transform (bỏ animate box-shadow vì tốn repaint) */
.open-btn{position:relative;width:82%;padding:13px;border-radius:30px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;
  letter-spacing:1.5px;text-indent:1.5px;text-transform:uppercase;box-shadow:0 12px 26px rgba(15,23,42,.28);will-change:transform;animation:pulse 1.8s var(--ease) infinite}
@keyframes pulse{50%{transform:scale(1.05) translateY(-3px)}}
/* Mở thiệp rồi thì dừng toàn bộ animation vô hạn của bìa cho nhẹ máy */

}

<script>
/* =====================================================================
   ⚙️  CẤU HÌNH — phần DUY NHẤT bạn cần sửa cho mỗi thiệp
   Chỉ sửa nội dung trong dấu nháy '...'. Đừng xóa dấu phẩy ở cuối dòng.
   ===================================================================== */
const CONFIG = {
  /* --- Thông tin tân cử nhân --- */
  graduate:  'Lê Trọng Nguyễn',   // Họ tên đầy đủ (hiện ở mục "Tân Cử Nhân"; dài quá chữ tự nhỏ lại cho vừa 1 dòng)
  firstName: 'Nguyễn',            // Tên gọi ngắn (dùng trong ô gợi ý "Gửi lời chúc đến ...")
  major:     'Luật Kinh Tế',      // Chuyên ngành
  year:      2027,                // Năm (hiện ở bìa)

  /* --- Thời gian & địa điểm --- */
  start:   '2027-11-21T09:30:00+07:00',   // Giờ bắt đầu: AAAA-TT-NNTGG:PP:00+07:00 (+07:00 = giờ Việt Nam). Đếm ngược & dòng "Thời gian" lấy từ đây
  venue:   'Nhà Hát Hòa Bình',            // Tên địa điểm
  address: '240 Đường 3/2, Hòa Hưng, TP.HCM',
  mapUrl:  'https://maps.app.goo.gl/aqQmzZK9TjaQgQw47',   // Link Google Maps cho nút "Xem bản đồ"
  phone:     '0909123456',        // Số điện thoại dạng liền (dùng để gọi)
  phoneText: '0909 123 456',      // Số hiển thị trên thiệp

  /* --- Câu chữ --- */
  defaultGuest: 'Quý Anh Chị / Bạn Bè',   // Tên hiện khi link KHÔNG có ?khach=...
  lead:   'đến tham dự lễ tốt nghiệp của', // Câu nối giữa tên khách và tên tân cử nhân
  thanks: '"Sự hiện diện của bạn là niềm vinh hạnh lớn, đánh dấu cột mốc ý nghĩa trên chặng đường mới của mình. Chân thành cảm ơn bạn vì luôn đồng hành!"',

  /* --- Hình ảnh (đặt file cạnh index.html, hoặc dán link ảnh đầy đủ) --- */
  portraitHeight: 290,            // px CHIỀU CAO người trong thiệp (đã tự cắt phần trong suốt thừa). To hơn → tăng (vd 320); bìa tự cao thêm cho vừa
  portraitMaxWidth: 270,          // px bề ngang tối đa của người (người quá rộng thì tự thu nhỏ để không đè sang chữ bên phải)
  portraitX: 16,                  // px cách lề trái. Âm = lệch sang trái, dương = sang phải
  portraitFade: 40,               // px độ rộng vùng mờ dần ở mép phải ảnh (0 = không mờ)
  portraitSink: 6,                // px ảnh chui xuống dưới mép khung "Sự hiện diện...". Còn hở khe giữa ảnh và khung → tăng số này (vd 10)
  portrait: 'portrait.png',       // ẢNH CHÂN DUNG TÁCH NỀN: PNG nền trong suốt, tỉ lệ 3:4 (vd 660×880), cắt từ đầu đến ngực
  photos: [                       // Xấp ảnh polaroid — thêm/bớt dòng tùy ý (nên 3–5 ảnh)
    { src: 'portrait.jpg', cap: 'Ngày đầu nhập trường' },
    { src: 'bg.jpg',       cap: 'Khuôn viên trường' },
    { src: 'portrait.jpg', cap: 'Mùa tốt nghiệp 2027' }
  ],
  // Các file khác trong thư mục: logo.png (logo ở bìa), bg.jpg (ảnh nền thiệp), og.jpg (ảnh xem trước khi gửi link)

  /* --- Nhạc & rung --- */
  music: 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3',
                                  // Link nhạc. Ổn định nhất: tải file về repo, đặt tên music.mp3 rồi ghi 'music.mp3'. Để '' = không nhạc
  musicVolume:  0.6,              // Âm lượng tối đa 0–1 (nhạc tự tăng dần khi mở thiệp). iPhone luôn dùng âm lượng máy
  preloadMusic: true,             // true = tải sẵn nhạc lúc rảnh cho lần mở đầu mượt (tốn vài MB 4G). false = chỉ tải khi mở
  lite:         'auto',           // Chế độ nhẹ cho máy yếu: 'auto' (tự nhận biết) / true (luôn bật) / false (luôn tắt). Thử nhanh: thêm ?lite=1 hoặc ?lite=0 vào link

  /* --- Nhận lời chúc & tim về Google Sheet (xem hướng dẫn Code.gs). Để '' = không gửi đi đâu --- */
  wishEndpoint: '',               // URL Web app Apps Script (kết thúc bằng /exec)
  token: 'doi-chuoi-bi-mat-cua-ban'   // Phải trùng TOKEN trong Code.gs
};

/* =====================================================================
   ✨ BẬT / TẮT HIỆU ỨNG — đổi true (bật) / false (tắt). Máy yếu giật thì tắt bớt các mục đánh dấu (nặng)
   ===================================================================== */
const EFFECTS = {
  blurIn:         false,   // Nội dung nhòe dần → rõ nét khi hiện          (nặng — mặc định tắt cho mượt)
  glassBlur:      true,    // Hộp kính mờ (blur nền phía sau hộp chữ)      (nặng)
  bgZoom:         true,    // Ảnh nền zoom nhẹ khi mở thiệp
  slideUp:        true,    // Các khối chữ trượt nhẹ từ dưới lên khi hiện
  coverFlip:      true,    // Bìa lật 3D khi mở (false = bìa chỉ mờ đi)
  coverShine:     true,    // Vệt sáng tráng gương chạy ngang bìa
  pulseButton:    true,    // Nút "Chạm để mở thiệp" nhấp nhô
  openConfetti:   true,    // Pháo giấy khi mở thiệp (số hạt: CONFETTI_OPEN bên dưới)
  reactConfetti:  true,    // Pháo nhỏ khi bấm thả tim / mũ
  touchStars:     true,    // Sao bay lên khi chạm vào chỗ trống trên thiệp
  autoContrast:   true,    // Chữ (tên, chuyên ngành) tự đổi màu tương phản nơi bị áo/ảnh chân dung che
  portraitShadow: true,    // Bóng đổ nhẹ quanh ảnh chân dung
  musicSpin:      true,    // Nút nhạc xoay khi đang phát
  vibrate:        true     // Rung nhẹ khi mở thiệp / thả tim (chỉ Android)
};
/* Áp dụng công tắc: thêm class vào <html> (CSS ở trên đọc các class này) */
Object.entries(EFFECTS).forEach(([k, on]) =>
  document.documentElement.classList.add((on ? 'fx-' : 'no-') + k.replace(/[A-Z]/g, c => '-' + c.toLowerCase())));

/* --- Tinh chỉnh giao diện (ít khi cần đổi) --- */
const DESIGN_W   = 420;   // Bề ngang thiết kế gốc (px). Thiệp tự co giãn theo bề ngang màn hình
const COVER_H    = 760 + Math.max(0, CONFIG.portraitHeight - 260);   // Chiều cao trang bìa (px, trước khi scale). Tự tăng theo cỡ ảnh chân dung; muốn bìa cao hơn nữa thì cộng thêm số vào cuối
const MAX_SCALE  = 1.5;   // Phóng to tối đa trên tablet/PC (1 = không phóng to)
const EXPAND_AT  = 750;   // ms sau khi chạm thì bung phần dưới ra (≈ lúc bìa lật xong)
const SETTLE_MS  = 2500;  // ms sau khi mở thì kính mờ (blur) mới bật. Nhỏ hơn = blur hiện sớm hơn (nhưng dễ giật hơn lúc đang chuyển động)
const EXPAND_MS  = 0;     // 0 = bung tức thì (mượt nhất, khuyên dùng). 300–500 = có chuyển động nhưng có thể giật trên máy yếu
const CONFETTI_OPEN = { particleCount: 40, spread: 55, startVelocity: 30, origin: { y: .65 } };  // Pháo giấy khi mở (particleCount = số hạt; 0 = tắt)

/* =====================================================================
   Từ đây trở xuống là mã chạy — bình thường KHÔNG cần sửa
   ===================================================================== */

/* ---------- Tiện ích ---------- */
const $ = id => document.getElementById(id);
const card = $('card'), stage = $('stage'), guestEl = $('guest');
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const pad = n => String(n).padStart(2, '0');
const startAt = new Date(CONFIG.start);
const buzz = p => { if (EFFECTS.vibrate) try { navigator.vibrate && navigator.vibrate(p); } catch {} };
function fitText(el, max, min) {                     // Thu nhỏ chữ dần cho vừa 1 dòng
  let fs = max; el.style.fontSize = fs + 'px';
  while (el.scrollWidth > el.clientWidth && fs > min) el.style.fontSize = (--fs) + 'px';
}

/* ---------- Scale thiệp theo màn hình ----------
   Đang đóng (bìa): scale đều để vừa cả ngang lẫn dọc. Đã mở: chỉ theo bề ngang, nội dung dài thì cuộn. */
document.documentElement.style.setProperty('--cover-h', COVER_H + 'px');
document.documentElement.style.setProperty('--sink', CONFIG.portraitSink + 'px');
document.documentElement.style.setProperty('--ph', CONFIG.portraitHeight + 'px');
document.documentElement.style.setProperty('--px', CONFIG.portraitX + 'px');
document.documentElement.style.setProperty('--fade', CONFIG.portraitFade + 'px');
document.documentElement.style.setProperty('--expand', EXPAND_MS + 'ms');
let fullH = COVER_H;                                 // chiều cao thiệp khi đã mở (đo từ nội dung)
const INSIDE_PAD = 40;                               // padding trên + dưới của .inside (22 + 18)
function measureFull() {
  fullH = Math.max(card.querySelector('.layer').offsetHeight + INSIDE_PAD, COVER_H);
  document.documentElement.style.setProperty('--full-h', fullH + 'px');
  return fullH;
}
let expanded = false;                                // đã bung phần dưới chưa
function fitScale() {
  const open = card.classList.contains('open');
  const sW = Math.min(MAX_SCALE, (document.documentElement.clientWidth - 24) / DESIGN_W);   // vừa bề ngang
  const sC = Math.min(sW, (innerHeight - 24) / COVER_H);                                    // vừa cả ngang lẫn dọc (bìa)
  const s = open ? sW : sC;
  card.style.setProperty('--s', s);
  stage.style.width = DESIGN_W * s + 'px';
  stage.style.height = (expanded ? fullH : COVER_H) * s + 'px';
  stage.style.marginTop = Math.max(0, (innerHeight - 24 - COVER_H * sC) / 2) + 'px';       // bìa nằm giữa màn hình; mở ra thì giữ nguyên mép trên (không nhảy)
}
addEventListener('resize', fitScale);
if ('ResizeObserver' in window) new ResizeObserver(() => { measureFull(); fitScale(); }).observe(card);

/* ---------- Đổ dữ liệu từ CONFIG vào thiệp ---------- */
document.querySelectorAll('[data-k]').forEach(el => el.textContent = CONFIG[el.dataset.k]);
$('name').textContent = CONFIG.graduate;
/* Tách từng ký tự thành <span class="ch"> để mỗi chữ tự chọn màu tương phản với phần ảnh nằm ngay phía sau nó */
function splitChars(el) {
  [...el.childNodes].forEach(n => {
    if (n.nodeType === 3) {
      const f = document.createDocumentFragment();
      Array.from(n.textContent.normalize('NFC')).forEach(c => {
        if (c === ' ') f.appendChild(document.createTextNode(' '));
        else { const sp = document.createElement('span'); sp.className = 'ch'; sp.textContent = c; f.appendChild(sp); }
      });
      n.replaceWith(f);
    } else if (n.nodeType === 1 && !n.classList.contains('ch')) splitChars(n);
  });
}
document.querySelectorAll('.name, .major').forEach(splitChars);
/* Ảnh chân dung: đo vùng có hình người (bỏ phần trong suốt thừa) rồi phóng cho người cao đúng portraitHeight, đáy chạm đáy khối */
let PD = null;                                        // dữ liệu điểm ảnh của ảnh chân dung (để đo màu phía sau chữ)
function fitPortrait() {
  const img = $('portrait'), root = document.documentElement.style;
  try {
    const nw = img.naturalWidth, nh = img.naturalHeight;
    if (!nw || !nh) return;
    const k = Math.min(1, 240 / Math.max(nw, nh));
    const w = Math.max(1, Math.round(nw * k)), h = Math.max(1, Math.round(nh * k));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const g = cv.getContext('2d', { willReadFrequently: true });
    g.drawImage(img, 0, 0, w, h);
    const d = g.getImageData(0, 0, w, h).data;
    let x0 = w, x1 = -1, y0 = h, y1 = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (d[(y * w + x) * 4 + 3] > 24) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    if (x1 < 0) return;                                           // ảnh trống
    const fx = x0 / w, fw = (x1 + 1 - x0) / w, fy = y0 / h, fh = (y1 + 1 - y0) / h;   // khung người (tỉ lệ 0–1 so với file ảnh)
    let H = CONFIG.portraitHeight / fh, W = H * nw / nh;          // cao ảnh để người cao đúng portraitHeight
    if (fw * W > CONFIG.portraitMaxWidth) { W = CONFIG.portraitMaxWidth / fw; H = W * nh / nw; }   // quá rộng → co theo bề ngang
    root.setProperty('--fw', fw * W + 'px');                      // rộng khung = rộng người
    root.setProperty('--ph', fh * H + 'px');                      // cao khung = cao người
    PD = { w, h, data: d, W, H, il: -fx * W, fy };
    root.setProperty('--iw', W + 'px'); root.setProperty('--ih', H + 'px');
    root.setProperty('--il', -fx * W + 'px');                     // dịch ảnh để mép trái người sát mép trái khung
    root.setProperty('--ib', -(1 - fy - fh) * H + 'px');          // dịch ảnh để mép dưới người sát đáy khung
    fitAll();
  } catch (e) { /* canvas bị chặn (mở file trực tiếp / ảnh ở tên miền khác) → dùng cỡ mặc định */ }
}
$('portrait').onload = fitPortrait;
$('portrait').src = CONFIG.portrait;
$('mapBtn').href = CONFIG.mapUrl;
$('tel').href = 'tel:' + CONFIG.phone;
$('tel').textContent = CONFIG.phoneText;
$('wishInput').placeholder = 'Gửi lời chúc đến ' + CONFIG.firstName + '...';
$('when').textContent = new Intl.DateTimeFormat('vi-VN', {
  timeZone: 'Asia/Ho_Chi_Minh', weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric',
  hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
}).format(startAt).replace(',', ' —');

/* ---------- Tên khách: lấy từ link ?khach=Tên (chủ thiệp tự ghi danh xưng, vd ?khach=Chị Lan) ---------- */
const params = new URLSearchParams(location.search);
const lowEnd = (navigator.deviceMemory && navigator.deviceMemory <= 2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
const lite = params.has('lite') ? params.get('lite') !== '0' : CONFIG.lite === 'auto' ? !!lowEnd : !!CONFIG.lite;
document.documentElement.classList.toggle('lite', lite);
const cleanName = raw => raw.trim().slice(0, 40);
const guestName = cleanName(params.get('khach') || '');
guestEl.value = guestName || CONFIG.defaultGuest;

/* Chữ nào nằm trên phần áo/ảnh có màu gần màu chữ thì tự đổi màu để rõ chữ (làm theo từng ký tự) */
function contrastText() {
  if (!EFFECTS.autoContrast || !PD) return;
  const hero = document.querySelector('.hero'), photo = document.querySelector('.photo');
  const pL = photo.offsetLeft, pT = photo.offsetTop, pW = photo.offsetWidth, pH = photo.offsetHeight;
  const fade = Math.min(CONFIG.portraitFade, pW), imgTop = -PD.fy * PD.H;
  const BG_L = .82, INK = [15, 23, 42], SLATE = [51, 65, 85];   // độ sáng nền thiệp; màu chữ tên / chuyên ngành
  const lin = v => (v /= 255) <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4);
  const lum = (r, g, b) => .2126 * lin(r) + .7152 * lin(g) + .0722 * lin(b);
  const posIn = el => {                                // vị trí phần tử trong .hero (đọc theo bố cục nên không lệch do animation)
    let x = 0, y = 0, n = el;
    while (n && n !== hero) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
    return { x, y, w: el.offsetWidth, h: el.offsetHeight };
  };
  const under = r => {                                 // độ sáng trung bình phía sau 1 ô chữ (ảnh người trộn với nền sáng)
    let sum = 0;
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
      const sx = r.x + r.w * (i + .5) / 4 - pL, sy = r.y + r.h * (j + .5) / 4 - pT;
      let a = 0, L = 0;
      if (sx >= 0 && sx <= pW && sy >= 0 && sy <= pH) {
        const ix = Math.min(PD.w - 1, Math.max(0, Math.floor((sx - PD.il) / PD.W * PD.w)));
        const iy = Math.min(PD.h - 1, Math.max(0, Math.floor((sy - imgTop) / PD.H * PD.h)));
        const k = (iy * PD.w + ix) * 4;
        a = PD.data[k + 3] / 255 * (fade > 0 ? Math.min(1, Math.max(0, (pW - sx) / fade)) : 1);   // tính cả vùng mờ viền phải
        L = lum(PD.data[k], PD.data[k + 1], PD.data[k + 2]);
      }
      sum += a * L + (1 - a) * BG_L;
    }
    return sum / 16;
  };
  /* Đo độ sáng phía sau chữ theo từng dải rộng ~3px dọc theo dòng, làm mượt thật rộng (~±36px), rồi dựng 1 gradient liên tục
     từ màu chữ gốc → trắng nhạt. Không cần tương phản tuyệt đối — chỉ cần hài hòa, chữ không bị chìm hẳn. */
  const SOFT = [244, 247, 251], T_MAX = .94, STEP = 3, SMOOTH = 12;   // SMOOTH: càng lớn dải chuyển màu càng dài/êm (12 ≈ ±36px)
  const sstep = (e0, e1, x) => { const u = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return u * u * (3 - 2 * u); };
  const blur = (arr, r) => arr.map((_, i) => { let s = 0, n = 0; for (let k = -r; k <= r; k++) { const v = arr[i + k]; if (v !== undefined) { s += v * (r + 1 - Math.abs(k)); n += r + 1 - Math.abs(k); } } return s / n; });   // làm mượt dạng tam giác
  [['.name', INK], ['.major', SLATE]].forEach(([sel, base]) => {
    const el = document.querySelector(sel), chs = el && [...el.querySelectorAll('.ch')];
    if (!chs || !chs.length) return;
    const e = posIn(el), boxes = chs.map(posIn);
    const x0 = Math.min(...boxes.map(b => b.x)), x1 = Math.max(...boxes.map(b => b.x + b.w));
    const xs = []; for (let x = x0; x <= x1 + STEP; x += STEP) xs.push(x);
    const L = blur(xs.map(x => under({ x: x - STEP / 2, y: e.y, w: STEP, h: e.h })), SMOOTH);
    const T = L.map(l => (1 - sstep(.05, .60, l)) * T_MAX);                 // 0 = màu gốc, T_MAX = gần trắng; vùng chuyển rộng nên êm
    const color = t => `rgb(${base.map((v, i) => Math.round(v + (SOFT[i] - v) * t))})`;
    const stops = [`${color(T[0])} 0%`, ...xs.map((x, i) => `${color(T[i])} ${((x - e.x) / e.w * 100).toFixed(2)}%`), `${color(T[T.length - 1])} 100%`];
    const peak = Math.max(...T);
    el.style.setProperty('--g', `linear-gradient(90deg,${stops.join(',')})`);
    el.classList.toggle('gtext', peak > .04);
    el.classList.toggle('shd', peak > .3);
  });
  const b = document.querySelector('.badge');
  if (b) b.classList.toggle('inv', under(posIn(b)) < .12);
}
const fitAll = () => { fitText($('name'), 22, 11); fitText(guestEl, 20, 12); measureFull(); fitScale(); contrastText(); };
fitAll();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
addEventListener('load', fitAll);

/* ---------- Bảng tạo link mời: thêm ?admin=1 vào cuối link để mở ---------- */
if (params.get('admin') === '1') $('admin').style.display = 'block';
const baseUrl = location.origin + location.pathname;
const inviteUrl = name => name ? `${baseUrl}?khach=${encodeURIComponent(name)}` : baseUrl;
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = Object.assign(document.createElement('textarea'), { value: text });
    document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
  }
}
$('aName').addEventListener('input', e => {          // xem trước tên ngay trên thiệp
  guestEl.value = cleanName(e.target.value) || CONFIG.defaultGuest; fitText(guestEl, 20, 12);
});
$('aToggle').onclick = () => {
  const bulk = $('admin').classList.toggle('bulk');
  $('aToggle').textContent = bulk ? 'Tạo từng link' : 'Tạo hàng loạt';
  $('aCopy').textContent = bulk ? 'Copy tất cả' : 'Copy link';
};
$('aCopy').onclick = async () => {
  const btn = $('aCopy');
  const text = $('admin').classList.contains('bulk')
    ? $('aBulk').value.split('\n').map(s => s.trim()).filter(Boolean).map(n => `${n}: ${inviteUrl(n)}`).join('\n')
    : inviteUrl($('aName').value.trim());
  if (!text) return;
  const label = btn.textContent;
  await copy(text);
  btn.textContent = 'Đã copy!'; btn.classList.add('ok');
  setTimeout(() => { btn.textContent = label; btn.classList.remove('ok'); }, 1800);
};
$('adminX').onclick = () => $('admin').style.display = 'none';

/* ---------- Gửi về Google Sheet (riêng tư, chỉ chủ thiệp xem) ---------- */
function send(data) {
  if (!CONFIG.wishEndpoint) return;
  const body = JSON.stringify({ token: CONFIG.token, guest: guestName || '(không tên)', ...data });
  try {
    fetch(CONFIG.wishEndpoint, { method: 'POST', mode: 'no-cors', keepalive: true,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body }).catch(() => {});
  } catch {}
}
const pend = { hearts: 0, caps: 0 };                 // Tim/mũ gom lại, 2 giây sau lần bấm cuối mới gửi 1 dòng
let pendTimer;
function flushReacts() {
  clearTimeout(pendTimer);
  if (!pend.hearts && !pend.caps) return;
  send({ kind: 'react', ...pend });
  pend.hearts = pend.caps = 0;
}
function queueReact(type) {
  pend[type === 'heart' ? 'hearts' : 'caps']++;
  clearTimeout(pendTimer); pendTimer = setTimeout(flushReacts, 2000);
}
addEventListener('pagehide', flushReacts);

/* ---------- Pháo giấy (chạy trong Web Worker để không giật) ---------- */
let fx = null;
function getFx() {
  if (fx || !window.confetti) return fx;
  try { fx = confetti.create($('fx'), { resize: true, useWorker: true }); }
  catch { fx = confetti; }
  return fx;
}

/* ---------- Nhạc nền: tăng dần âm lượng, nhớ lựa chọn bật/tắt, tự dừng khi rời trang ---------- */
const audio = $('bgMusic'), musicBtn = $('musicBtn');
let musicOn = store.get('musicOn', true);            // lựa chọn của khách (nhớ cho lần mở sau)
let fadeTimer, resumeAfterHide = false;
if (!CONFIG.music) musicBtn.hidden = true;
musicBtn.textContent = musicOn ? '🎵' : '🔇';
audio.addEventListener('error', () => musicBtn.hidden = true);

function fadeTo(target, ms, done) {
  clearInterval(fadeTimer);
  const from = audio.volume, steps = Math.max(1, ms / 50);
  let i = 0;
  fadeTimer = setInterval(() => {
    audio.volume = Math.min(1, Math.max(0, from + (target - from) * ++i / steps));
    if (i >= steps) { clearInterval(fadeTimer); if (done) done(); }
  }, 50);
}
function playMusic() {
  if (!audio.src) audio.src = CONFIG.music;
  audio.volume = 0;
  audio.play().then(() => {
    musicBtn.classList.add('playing'); musicBtn.textContent = '🎵';
    fadeTo(CONFIG.musicVolume, 2500);
  }).catch(() => {});
}
function stopMusic() {
  fadeTo(0, 500, () => audio.pause());
  musicBtn.classList.remove('playing'); musicBtn.textContent = '🔇';
}
musicBtn.onclick = e => {
  e.stopPropagation();
  musicOn = audio.paused;
  store.set('musicOn', musicOn);
  musicOn ? playMusic() : stopMusic();
};
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {                             // chuyển app / khóa màn hình: dừng nhạc, gửi nốt tim đang chờ
    flushReacts();
    if (!audio.paused) { resumeAfterHide = true; audio.pause(); musicBtn.classList.remove('playing'); }
  } else if (resumeAfterHide) {                      // quay lại: phát tiếp
    resumeAfterHide = false;
    audio.play().then(() => musicBtn.classList.add('playing')).catch(() => {});
  }
});

/* ---------- Mở / đóng thiệp ---------- */
let isOpen = false, busy = false, settleTimer, expandTimer;
/* MỞ: ① bìa lật + phần trên thiệp hiện (cùng cao COVER_H → khớp nhau)  ② lật xong mới bung phần dưới (đúng 1 lần, không animate layout) */
function openCard() {
  if (isOpen || busy) return;
  isOpen = true;
  const inside = $('inside');
  document.body.classList.add('anim');
  measureFull();
  card.classList.add('open');
  fitScale();
  if (CONFIG.music && musicOn) playMusic();            // phải nằm ngay trong lần chạm thì iOS mới cho phát
  buzz([15, 30, 15]);
  expandTimer = setTimeout(() => {
    expanded = true;
    inside.style.height = fullH + 'px';
    card.classList.add('expanded');
    fitScale();
  }, EXPAND_AT);
  setTimeout(() => {                                   // pháo giấy sau khi bung, tránh tranh tài nguyên với cú lật
    const f = EFFECTS.openConfetti && CONFETTI_OPEN.particleCount > 0 && !lite && isOpen && getFx();
    if (f) f(CONFETTI_OPEN);
  }, EXPAND_AT + 400);
  setTimeout(() => {
    if (!store.get('opened', false)) { store.set('opened', true); send({ kind: 'open' }); }
  }, 2000);
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => {
    card.classList.add('settled');                     // nhả will-change cho nhẹ máy
    if (isOpen) inside.style.height = 'auto';
  }, SETTLE_MS);
}
/* ĐÓNG — không animate chiều cao nữa (đó là chỗ nặng nhất nên giật):
   ① cuộn về đầu trang (phần thiệp dài phía dưới lúc này nằm ngoài màn hình, các khối thấp mờ nhanh)
   ② thiệp co về đúng cao bằng bìa NGAY (1 lần) và bìa lật về phủ lên phần nội dung đang còn thấy, nội dung mờ dần cùng lúc.
   Bìa luôn cao bằng thiệp nên khớp nhau suốt cú lật. */
function closeCard() {
  if (!isOpen || busy) return;
  busy = true;
  clearTimeout(expandTimer); clearTimeout(settleTimer);
  card.classList.remove('settled');                    // tắt blur kính cho nhẹ
  card.classList.add('closing');
  if (scrollY > 4) window.scrollTo({ top: 0, behavior: 'smooth' });
  const t0 = performance.now();
  (function waitTop() {                                // chờ cuộn xong (tối đa 0,9s)
    const t = performance.now() - t0;
    if ((scrollY < 4 && t > 120) || t > 900) finishClose(); else requestAnimationFrame(waitTop);
  })();
}
function finishClose() {
  expanded = false; isOpen = false;
  $('inside').style.height = COVER_H + 'px';           // co tức thì (EXPAND_MS = 0), không tốn bố cục từng khung hình
  card.classList.remove('open', 'expanded', 'closing'); // bìa lật về + nội dung mờ dần + scale về vừa màn hình (đều chạy bằng GPU)
  fitScale();
  setTimeout(() => { busy = false; }, 900);
}
$('cover').onclick = openCard;
$('closeBtn').onclick = closeCard;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

/* Khởi động trước lúc rảnh: tải/giải mã ảnh, tạo worker pháo giấy, tải sẵn nhạc → lần chạm đầu không bị khựng */
function warmUp() {
  ['bg.jpg', CONFIG.portrait, ...CONFIG.photos.map(p => p.src)].forEach(src => {
    const im = new Image(); im.src = src;
    if (im.decode) im.decode().catch(() => {});
  });
  getFx();
  if (CONFIG.music && CONFIG.preloadMusic && !audio.src) { audio.preload = 'auto'; audio.src = CONFIG.music; }
}
addEventListener('load', () => (window.requestIdleCallback || (f => setTimeout(f, 800)))(warmUp, { timeout: 4000 }));

/* ---------- Hiệu ứng nhỏ ---------- */
$('inside').addEventListener('click', e => {         // sao bay khi chạm vào chỗ trống
  if (!EFFECTS.touchStars || e.target.closest('button,a,input,form,.stack')) return;
  const s = document.createElement('div');
  s.className = 'touch-star';
  s.textContent = ['✨', '⭐', '🎓', '💛'][Math.floor(Math.random() * 4)];
  s.style.left = e.clientX + 'px'; s.style.top = e.clientY + 'px';
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 1000);
});
document.addEventListener('error', e => {            // ảnh lỗi/thiếu: ẩn thay vì hiện icon vỡ
  if (e.target.tagName === 'IMG') e.target.style.visibility = 'hidden';
}, true);

/* ---------- Xấp ảnh polaroid ---------- */
const stack = $('stack');
const tilt = ['-4deg', '3deg', '-2deg'];
CONFIG.photos.slice().reverse().forEach(p => {
  const f = document.createElement('figure');
  f.className = 'pol';
  f.innerHTML = '<img alt=""><span></span>';
  f.firstChild.src = p.src; f.lastChild.textContent = p.cap;
  stack.appendChild(f);
});
function layoutStack() {
  [...stack.children].forEach((c, i) => { c.style.zIndex = i + 1; c.style.setProperty('--r', tilt[i % 3]); });
}
function nextPolaroid() {
  const top = stack.lastElementChild;
  if (!top || top.classList.contains('fly')) return;
  top.classList.add('fly');
  setTimeout(() => { top.classList.remove('fly'); stack.prepend(top); layoutStack(); }, 450);
}
layoutStack();
stack.onclick = nextPolaroid;
stack.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); nextPolaroid(); } };

/* ---------- Đếm ngược ---------- */
(function tick() {
  const diff = startAt - Date.now();
  if (diff <= 0) {
    $('cd').innerHTML = '<div class="cd-done">🎉 Buổi lễ đã diễn ra — cảm ơn bạn!</div>';   // 👉 sửa câu này nếu muốn
    return;
  }
  const sec = Math.floor(diff / 1000);
  if (!document.hidden) {                            // tab ẩn thì khỏi cập nhật giao diện
    $('d').textContent = pad(Math.floor(sec / 86400));
    $('h').textContent = pad(Math.floor(sec % 86400 / 3600));
    $('m').textContent = pad(Math.floor(sec % 3600 / 60));
    $('s').textContent = pad(sec % 60);
  }
  setTimeout(tick, 1000 - Date.now() % 1000);
})();

/* ---------- Thả tim & lưu bút ---------- */
const counts = store.get('reacts', { heart: 0, cap: 0 });
const showCounts = () => { $('heart').textContent = counts.heart; $('capn').textContent = counts.cap; };
showCounts();
document.querySelectorAll('[data-react]').forEach(b => b.onclick = () => {
  counts[b.dataset.react]++; store.set('reacts', counts); showCounts(); queueReact(b.dataset.react);
  buzz(12);
  const f = EFFECTS.reactConfetti && getFx();
  if (f) {
    const r = b.getBoundingClientRect();
    f({
      particleCount: 14, spread: 50, scalar: .8, startVelocity: 22,
      origin: { x: (r.left + r.width / 2) / innerWidth, y: r.top / innerHeight },
      shapes: ['circle'], colors: b.dataset.react === 'heart' ? ['#f43f5e', '#fb7185'] : ['#0369a1', '#38bdf8']
    });
  }
});

const wishes = store.get('wishes', []);              // lời chúc của chính khách, lưu trên máy họ
function renderWish(w) {
  const row = document.createElement('div');
  const who = document.createElement('b');
  who.textContent = w.name + ': ';
  row.append(who, document.createTextNode(w.text));  // textContent → không bị chèn mã độc
  $('feed').prepend(row);
}
wishes.forEach(renderWish);
$('wishForm').onsubmit = e => {
  e.preventDefault();
  const text = $('wishInput').value.trim().slice(0, 140);
  if (!text) return;
  const w = { name: guestName || 'Khách mời', text };
  wishes.push(w); store.set('wishes', wishes.slice(-30)); renderWish(w);
  $('wishInput').value = '';
  send({ kind: 'wish', text });
};
</script>
</body>
</html>
